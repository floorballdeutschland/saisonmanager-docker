services:
  nginx:
    build:
      context: nginx
      dockerfile: nginx.Dockerfile
    container_name: saisonmanager_dev_nginx
    image: saisonmanager_dev_nginx

    ports:
      - "49200:443"
    volumes:
      - ./nginx/config:/etc/nginx/:ro
      - ./nginx/logs:/logs
      - ./saisonmanager-frontend:/saisonmanager-frontend
    restart: unless-stopped
  rails-api:
    build:
      context: ../saisonmanager-api
      dockerfile: Dockerfile
    container_name: saisonmanager_rails_api
    image: saisonmanager_rails_api
    volumes:
      - ../saisonmanager-api:/app
      - ../saisonmanager-api/.shell_aliases:/root/.aliases:ro
    environment:
      DB_DATABASE: saisonmanager
      DB_USERNAME: saisonmanager
      DB_PASSWORD: saisonmanager
      RAILS_MASTER_KEY: abc123
      DB_HOST: postgres
      DB_PORT: 5432
      RAILS_ENV: production # development als Entwickler nutzen
      # Sentry-Fehler-Tracking. Der DSN kommt aus der gitignorierten .env im
      # docker-Verzeichnis (kein Token im Repo). Ist er nicht gesetzt (z. B.
      # lokale Entwicklung), bleibt der Wert leer und Sentry inaktiv – der
      # Initializer (config/initializers/sentry.rb) aktiviert Sentry ohnehin
      # nur in production/staging.
      SENTRY_DSN: "${SENTRY_DSN:-}"
    # Dateideskriptoren. Ohne diesen Eintrag erbt der Container das Limit des
    # Docker-Daemons; auf dem Prod-Host sind das gemessene 1024 weiche
    # Deskriptoren -- fuer einen Webserver viel zu wenig. (Kein allgemeiner
    # Docker-Standard: auf dem Arbeitsplatzrechner liefert dasselbe Kommando
    # 1048576.) Am 1. Bundesliga-Spieltag (12.09.2026) war die Grenze
    # dauerhaft erreicht: Puma konnte keine Verbindungen mehr annehmen und
    # meldete rund 33 mal pro Sekunde
    #   Listen loop: #<Errno::EMFILE: Too many open files - accept(2)>
    # waehrend rund 1350 Verbindungen unbeantwortet in der Accept-Queue des
    # Kernels standen. Fuer die Nutzer sah das nach einem haengenden Server
    # aus; der Median der Antwortzeiten fiel nach dem Anheben von ueber drei
    # Sekunden auf 25 ms.
    #
    # nginx traegt aus demselben Grund worker_rlimit_nofile 65535
    # (nginx/config/nginx.conf), nur die API war nie nachgezogen worden.
    #
    # Warum 8192 und nicht mehr: Der legitime Bedarf ist klein. Bei den
    # gemessenen 46 Requests/s und 65 ms Mittelwert laufen nach Little's Law
    # rund drei Anfragen gleichzeitig. Die 1024 wurden nicht von echter Last
    # gesprengt, sondern vom Socket-Leck aus proxy.conf und vom Rueckstau.
    # 8192 laesst also reichlich Luft fuer echte Spitzen (Playoffs, Finaltag)
    # und bleibt zugleich ein Fruehwarnmelder: Wird diese Grenze je erreicht,
    # stimmt wieder etwas grundsaetzlich nicht. Ein sehr hohes Limit wuerde
    # genau diese Warnung beseitigen -- das alte Limit war der Grund, warum
    # das Leck ueberhaupt auffiel.
    #
    # Das HARTE Limit bleibt bei 524288 und wird bewusst NICHT mitgesenkt.
    # Genau davon lebte die Rettung am Spieltag: prlimit --nofile am laufenden
    # Prozess hebt das weiche Limit ohne Neustart an, aber nur bis zum harten.
    # Ein hard: 8192 haette diesen Notausgang auf denselben Wert zugemauert,
    # den es zu ueberschreiten gilt.
    #
    # Zu beachten: rlimit gilt je Prozess. Mit WEB_CONCURRENCY hat jeder Worker
    # eigene 8192, die Warnschwelle liegt in Summe also hoeher.
    ulimits:
      nofile:
        soft: 8192
        hard: 524288
    restart: unless-stopped
  postgres:
    image: postgres:12
    container_name: saisonmanager_postgres
    environment:
      POSTGRES_USER: saisonmanager
      POSTGRES_PASSWORD: saisonmanager
      POSTGRES_DB: saisonmanager
    volumes:
      #- ./postgres/data:/var/lib/postgresql/data    # für die entwicklung gerne aktivieren.
      - ./postgres/scripts:/docker-entrypoint-initdb.d/
      - ./postgres/dumps:/db-dumps/
    ports:
      - "49201:5432"
    restart: unless-stopped
