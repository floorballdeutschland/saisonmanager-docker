# ════════════════════════════════════════════════════════════════════════
# doku.saisonmanager.dev – Staging-Spiegel des Rollenhandbuchs
#
# WICHTIG: Diese Datei wird NICHT automatisch geladen (analog zu
# saisonmanager.staging.conf). Sie wird erst aktiv, wenn auf dem Server in
# der (untracked) nginx.prod.conf die Zeile
#     include /etc/nginx/doku.staging.conf;
# ergänzt wird. Das geschieht bewusst ERST, NACHDEM das Let's-Encrypt-Cert
# für doku.saisonmanager.dev existiert (siehe README) – sonst scheitert
# jeder weitere `nginx -t`/Prod-Deploy an einem fehlenden Cert-Pfad, und
# damit auch der produktive saisonmanager.org-Vhost in derselben Datei.
#
# Analog zu doku.saisonmanager.org (siehe saisonmanager.prod.conf): statisch,
# öffentlich ohne Basic Auth (keine sensiblen Daten), aber wie der Rest von
# saisonmanager.dev mit X-Robots-Tag: noindex versehen, damit die
# Staging-Kopie nicht neben der produktiven Doku indexiert wird.
# Wird beim Staging-Frontend-Deploy nach
# /saisonmanager-frontend-staging/doku/ ausgeliefert (gleiches Angular-Asset
# wie in Prod, siehe angular.json im Frontend-Repo – die "doku"-Asset-Regel
# gilt für alle Build-Konfigurationen inkl. "staging").
# ════════════════════════════════════════════════════════════════════════
server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name doku.saisonmanager.dev;

	ssl_certificate     /etc/letsencrypt/live/doku.saisonmanager.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/doku.saisonmanager.dev/privkey.pem;

	# security
	include security.conf;

	# Staging-Kopie niemals indexieren lassen
	add_header X-Robots-Tag "noindex, nofollow" always;

	# logging
	access_log /logs/doku.staging.access.log;
	error_log  /logs/doku.staging.error.log warn;

	root  /saisonmanager-frontend-staging/doku/;
	index rollenhandbuch.html;

	location / {
		try_files $uri $uri/ /rollenhandbuch.html;
	}

	include general.conf;
}

# HTTP → HTTPS redirect (mit ACME-Challenge-Ausnahme für Cert-Erneuerung).
# Nutzt wie die übrigen Vhosts das Prod-Frontend-Verzeichnis als Webroot,
# damit certbot --webroot dieselbe Quelle wie der Default-:80-Server nutzt
# und es kein Henne-Ei-Problem gibt (weder bei Erstausstellung noch Renewal).
server {
	listen 80;
	listen [::]:80;
	server_name doku.saisonmanager.dev;

	location /.well-known/acme-challenge/ {
		root /saisonmanager-frontend/;
	}

	location / {
		return 301 https://doku.saisonmanager.dev$request_uri;
	}
}
