proxy_http_version	1.1;
proxy_cache_bypass	$http_upgrade;

# Connection-Header: NICHT fest "upgrade", sondern ueber die map
# $connection_upgrade (definiert in saisonmanager.prod.conf bzw.
# saisonmanager.dev.conf).
#
# Vorher hing an *jedem* proxied Request ein "Connection: upgrade", obwohl
# die Anwendung gar keine Websockets nutzt (ActionCable ist im API-Repo nur
# das unbenutzte Rails-Geruest, es gibt keine Channels und kein mount in den
# Routen; erreichbar waere /cable ohnehin nicht, nginx reicht nur /api und
# /verband weiter).
#
# WOFUER der Header NICHT verantwortlich war: Puma schliesst eine
# HTTP/1.1-Verbindung nur, wenn der Client exakt "Connection: close" sendet
# (puma/response.rb: keep_alive = env[HTTP_CONNECTION].downcase != "close").
# "upgrade" wurde also genauso offengehalten wie ein fehlender Header --
# nachgestellt und nachgemessen. Die rund 590 CLOSE_WAIT-Sockets am 1.
# Bundesliga-Spieltag (12.09.2026) stammen aus der schieren Zahl kurzlebiger
# Verbindungen (siehe upstream unten) und daraus, dass der zu 100 %
# ausgelastete Einzelprozess sie nicht schnell genug abraeumte.
#
# WOFUER er sehr wohl verantwortlich war: nginx gibt eine als "upgrade"
# markierte Verbindung nicht in den keepalive-Pool zurueck. Ohne diese
# Aenderung waere der upstream-Block unten wirkungslos geblieben. Die map
# liefert fuer normale Requests den leeren Wert -- gemessen kommt beim
# Upstream dann gar kein Connection-Header an, und mehrere Requests laufen
# ueber dieselbe TCP-Verbindung.
#
# Diese Datei wird an sieben Stellen eingebunden, aber nur vier davon haben
# einen upstream-Block mit Pool (saisonmanager.prod.conf zweimal,
# saisonmanager.staging.conf zweimal). Der /mailpit/-Block und die beiden
# Blocks in saisonmanager.dev.conf bekommen nur den korrigierten Header ohne
# den Pool -- dort faellt kein Verkehr an, der das lohnte.
proxy_set_header Upgrade			$http_upgrade;
proxy_set_header Connection 		$connection_upgrade;
proxy_set_header Host				$host;
proxy_set_header X-Real-IP			$remote_addr;
proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto	$scheme;
proxy_set_header X-Forwarded-Host	$host;
proxy_set_header X-Forwarded-Port	$server_port;

proxy_connect_timeout       600s;
proxy_send_timeout          600s;
proxy_read_timeout          600s;
send_timeout                600s;
