proxy_http_version	1.1;
proxy_cache_bypass	$http_upgrade;

# Connection-Header: NICHT fest "upgrade", sondern ueber die map
# $connection_upgrade (definiert in saisonmanager.prod.conf bzw.
# saisonmanager.dev.conf).
#
# Vorher hing an *jedem* proxied Request ein "Connection: upgrade", obwohl
# die Anwendung gar keine Websockets nutzt (ActionCable ist im API-Repo nur
# das unbenutzte Rails-Geruest, es gibt keine Channels und kein mount in den
# Routen; erreichbar waere /cable ohnehin nicht, nginx reicht nur /api und
# /verband weiter).
#
# WOFUER der Header NICHT verantwortlich war -- zwei Erklaerungen, die beide
# beim Nachmessen gefallen sind und hier stehen, damit sie niemand ein
# drittes Mal aufschreibt:
#
#   1. "Er verhindert, dass die Verbindung sauber beendet wird." Nein. Puma
#      schliesst eine HTTP/1.1-Verbindung nur bei exakt "Connection: close"
#      (puma/response.rb:442, resp_info[:keep_alive] =
#      env.fetch(HTTP_CONNECTION, "").downcase != CLOSE). Das .fetch mit
#      Default "" ist der Punkt: "upgrade" wird genauso offengehalten wie ein
#      fehlender Header.
#   2. "nginx gibt eine so markierte Verbindung nicht in den keepalive-Pool
#      zurueck." Ebenfalls nein. nginx entscheidet das an der ANTWORT des
#      Upstreams (u->keepalive = !u->headers_in.connection_close), nicht am
#      Header, den es selbst sendet; u->upgrade setzt es nur bei einer
#      101-Antwort. Nachgemessen mit zwei identischen upstream-Bloecken:
#      30 Requests mit festem "upgrade" liefen ueber EINE Verbindung, genau
#      wie 30 Requests mit der map.
#
# Der upstream-Block unten haette also auch ohne diese Aenderung gewirkt, und
# die rund 590 CLOSE_WAIT-Sockets am 1. Bundesliga-Spieltag (12.09.2026)
# stammen aus der schieren Zahl kurzlebiger Verbindungen und daraus, dass der
# zu 100 % ausgelastete Einzelprozess sie nicht abraeumte.
#
# WARUM der Header trotzdem weg soll: Er behauptet eine Protokolleigenschaft,
# die diese Anwendung nicht hat -- es gibt keinen Websocket und damit nie eine
# 101-Antwort. Danebenstehend wird dadurch auch proxy_cache_bypass
# $http_upgrade irrefuehrend. Die map liefert fuer normale Requests den leeren
# Wert; gemessen kommt beim Upstream dann gar kein Connection-Header an.
#
# Diese Datei wird an sieben Stellen eingebunden, aber nur vier davon haben
# einen upstream-Block mit Pool (saisonmanager.prod.conf zweimal,
# saisonmanager.staging.conf zweimal). Der /mailpit/-Block und die beiden
# Blocks in saisonmanager.dev.conf bekommen nur den korrigierten Header ohne
# den Pool -- dort faellt kein Verkehr an, der das lohnte.
proxy_set_header Upgrade			$http_upgrade;
proxy_set_header Connection 		$connection_upgrade;
proxy_set_header Host				$host;
proxy_set_header X-Real-IP			$remote_addr;
proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto	$scheme;
proxy_set_header X-Forwarded-Host	$host;
proxy_set_header X-Forwarded-Port	$server_port;

proxy_connect_timeout       600s;
proxy_send_timeout          600s;
proxy_read_timeout          600s;
send_timeout                600s;
