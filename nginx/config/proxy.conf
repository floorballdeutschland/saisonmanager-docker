proxy_http_version	1.1;
proxy_cache_bypass	$http_upgrade;

# Connection-Header: NICHT fest "upgrade", sondern ueber die map
# $connection_upgrade (definiert in saisonmanager.prod.conf bzw.
# saisonmanager.dev.conf).
#
# Vorher hing an *jedem* proxied Request ein "Connection: upgrade", obwohl
# die Anwendung gar keine Websockets nutzt (ActionCable ist im API-Repo nur
# das unbenutzte Rails-Geruest, es gibt keine Channels und kein mount in den
# Routen). Der Header verhindert, dass die Verbindung sauber beendet wird:
# Am 1. Bundesliga-Spieltag (12.09.2026) standen rund 590 Sockets der API in
# CLOSE_WAIT -- die Gegenseite hatte laengst geschlossen, der Deskriptor
# blieb belegt. Zusammen mit dem Deskriptor-Limit von 1024 lief Puma damit in
# "Errno::EMFILE: Too many open files - accept(2)" und nahm keine
# Verbindungen mehr an.
#
# Die map liefert fuer normale Requests den leeren Wert. Das ist die
# Voraussetzung dafuer, dass die keepalive-Verbindungen zum Upstream
# (siehe upstream rails_api) ueberhaupt wiederverwendet werden: Ein
# "Connection: close" wuerde sie nach jedem Request verwerfen.
proxy_set_header Upgrade			$http_upgrade;
proxy_set_header Connection 		$connection_upgrade;
proxy_set_header Host				$host;
proxy_set_header X-Real-IP			$remote_addr;
proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto	$scheme;
proxy_set_header X-Forwarded-Host	$host;
proxy_set_header X-Forwarded-Port	$server_port;

proxy_connect_timeout       600s;
proxy_send_timeout          600s;
proxy_read_timeout          600s;
send_timeout                600s;
