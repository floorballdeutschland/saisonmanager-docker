# Header fuer Seiten, die auf fremden Websites per iframe eingebettet werden
# duerfen (Schiedsrichterkurse unter /kurse-einbettung/).
#
# Ersetzt fuer diese Location security_base.conf: add_header wird in nginx
# nicht gemischt, sondern ersetzt. Sobald eine Location eines setzt, fallen ALLE
# serverweiten weg. Deshalb stehen hier alle Sicherheits-Header noch einmal,
# nur X-Frame-Options (SAMEORIGIN) ist durch frame-ancestors ersetzt.
#
# frame-ancestors https: erlaubt jede Seite mit HTTPS als Einbetter. Die Seite
# zeigt nur oeffentliche Kursangaben ohne Online-Link, angemeldet wird im
# Saisonmanager selbst (neuer Tab). Eine Liste der Verbandsdomains waere
# moeglich, muesste aber bei jedem neuen Webauftritt nachgezogen werden.
add_header Content-Security-Policy   "frame-ancestors https:" always;
add_header X-XSS-Protection          "1; mode=block" always;
add_header X-Content-Type-Options    "nosniff" always;
# Wie security_base.conf (#43): fremde Seiten sehen nur den Ursprung.
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# Die Einbettung ist kein eigener Inhalt fuer Suchmaschinen; die Kursseite
# /schiri-kurse ist es.
add_header X-Robots-Tag              "noindex" always;
# Ohne Fingerprint im Dateinamen: nach einem Deploy sofort revalidieren.
add_header Cache-Control             "no-cache" always;
