# ════════════════════════════════════════════════════════════════════════
# saisonmanager.dev – Staging-Umgebung
#
# WICHTIG: Diese Datei wird NICHT automatisch geladen. Sie wird erst aktiv,
# wenn auf dem Server in der (untracked) nginx.prod.conf – die den http{}-Block
# definiert und die Vhosts inkludiert – die Zeile
#     include /etc/nginx/saisonmanager.staging.conf;
# ergänzt wird. Das geschieht bewusst ERST, NACHDEM das Let's-Encrypt-Cert für
# saisonmanager.dev existiert (siehe README), damit ein `nginx -t`/Prod-Deploy
# nicht an einem fehlenden Cert scheitert.
#
# Nutzt denselben nginx wie Prod, proxyt aber auf den isolierten
# Staging-Rails-Container und liefert das Staging-Frontend aus. Zugriffsschutz:
# Basic Auth (eigene Datei /etc/htpasswd-staging, eigene Zugangsdaten – bewusst
# nicht /etc/htpasswd von Prod) + X-Robots-Tag: noindex. /api bleibt – wie in
# Prod – ohne Basic Auth, da dort der API-Key/Cookie-Schutz der Rails-API greift.
# ════════════════════════════════════════════════════════════════════════
server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name saisonmanager.dev;

	ssl_certificate     /etc/letsencrypt/live/saisonmanager.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/saisonmanager.dev/privkey.pem;

	# security
	include security.conf;

	# Testumgebung niemals indexieren lassen
	add_header X-Robots-Tag "noindex, nofollow" always;

	# Revalidierung für i18n-Übersetzungen und App-Shell (index.html) – wie in
	# Prod, damit Deploys sofort greifen statt aus dem Heuristik-Cache zu kommen.
	# Die map $sm_cache_control ist in saisonmanager.prod.conf definiert und gilt
	# http-weit (beide Dateien werden in nginx.prod.conf in http{} inkludiert).
	add_header Cache-Control $sm_cache_control always;

	# logging
	access_log /logs/saisonmanager.dev.access.log;
	error_log  /logs/saisonmanager.dev.error.log warn;

	# Rails API (Staging-Container)
	# /api-zugang ist eine Angular-Route (öffentlicher Antrag auf einen
	# API-Zugang) und kein API-Endpunkt. Ohne diesen Block gewinnt das
	# kürzere Präfix "location /api" darunter, nginx reicht die Adresse an
	# Rails weiter und die Seite antwortet mit 404. nginx wählt das längste
	# passende Präfix, deshalb genügt der eigene Block.
	location /api-zugang {
		root /saisonmanager-frontend-staging/;
		try_files $uri $uri/ /index.html;
	}

	location /api {
		proxy_pass http://rails-api-staging:3000/api;
		include proxy.conf;
	}

	# Kalender-Abos unter der alten Adresse, siehe die Begruendung in
	# saisonmanager.prod.conf: Ein /calendar/... landete im SPA-Fallback, und der
	# Angular-Router warf NG04002.
	#
	# Hier antwortet der Block ohne Basic Auth, und zwar NICHT wegen seiner
	# Stelle in der Datei: nginx waehlt unter Praefix-Locations immer die
	# laengste passende, unabhaengig von der Reihenfolge. `/calendar/` gewinnt
	# also gegen `/` allein wegen der Laenge. Ohne Auth ist die Antwort, weil
	# `auth_basic` in dieser Datei nirgends im server-Block steht, sondern nur in
	# einzelnen location-Bloecken -- es gibt schlicht nichts zu erben. Wer das
	# spaeter aendert und `auth_basic` eine Ebene hoeher zieht, muss diesen Block
	# und den fuer /overlay/ weiter unten ausdruecklich ausnehmen.
	location /calendar/ {
		return 301 /api/v2$request_uri;
	}

	# Statische Dateien von Rails (Logos etc.)
	location /verband {
		proxy_pass http://rails-api-staging:3000/verband;
		include proxy.conf;
	}

	# Livestream-Overlays (OBS): bewusst OHNE Basic Auth.
	#
	# Zwei Gründe. Erstens können Browser-Quellen in OBS keinen
	# Basic-Auth-Dialog bedienen: Statt der Grafik steht dann die weiße
	# 401-Seite von nginx über dem Kamerabild. Zweitens sollen Vereinsstreamer
	# die Overlays vor dem Einsatz auf der Testumgebung ausprobieren können,
	# ohne dass jemand die Staging-Zugangsdaten weitergibt.
	#
	# Der Schutz liegt hier nicht am Vhost, sondern im Token: Jede Adresse trägt
	# ein Token, das nur erzeugen kann, wer den Spielbericht führen darf, und die
	# Daten kommen über /api aus dem PublicOverlayController, der das Token prüft
	# (ungültig, abgelaufen oder widerrufen ergibt 410). Wer die Adresse ohne
	# gültiges Token öffnet, bekommt also keine Spieldaten.
	#
	# Ausgeliefert werden hier nur statische Dateien: index.html, dock.html,
	# eigenes CSS/JS, Schriften, Bilder. Angular-Bundles sind nicht darunter, die
	# App selbst bleibt also vollständig hinter der Basic Auth. Auch die Logos
	# kommen nicht von hier, sondern als ActiveStorage-Pfade unter /api/storage,
	# und damit ebenfalls über "location /api".
	#
	# Der Block deklariert bewusst kein add_header. add_header wird nicht
	# gemischt, sondern ersetzt: Sobald hier eines steht, fallen die serverweiten
	# weg und die Overlays verlieren X-Robots-Tag: noindex.
	#
	# try_files zählt nur Dateipfade auf und endet mit =404, nie mit einem
	# URI-Fallback. Ein URI-Fallback wie /index.html löst einen internen Redirect
	# aus, der die Location-Auswahl neu durchläuft und dann in "location /" mit
	# auth_basic landet. Die Ausnahme wäre damit wirkungslos und die Antwort
	# wieder 401. Genau das passiert im Block für /api-zugang weiter oben.
	#
	# Einfaches Präfix statt ^~: Damit verliert dieser Block gegen jede
	# Regex-Location, die auf eine Overlay-Adresse passt. Heute passt keine, eine
	# künftige Regex über .js/.css würde die Basic Auth hier aber stillschweigend
	# wieder einschalten. ^~ nähme umgekehrt das "deny all" für Dotfiles aus
	# security_base.conf aus diesem Verzeichnis heraus, deshalb das Präfix.
	location /overlay/ {
		root /saisonmanager-frontend-staging/;
		try_files $uri $uri/index.html =404;
	}

	# Das Präfix oben deckt /overlay ohne Schrägstrich nicht ab; ohne diesen
	# Block landet die Adresse in "location /" und antwortet 401, während Prod
	# dafür auf /overlay/ umleitet. Die erzeugten Links tragen immer den vollen
	# Dateinamen, das trifft also nur von Hand getippte Adressen.
	location = /overlay {
		return 301 /overlay/;
	}

	# Mailpit Web-UI (gefangene E-Mails), hinter Basic Auth
	location /mailpit/ {
		auth_basic "Saisonmanager Staging";
		auth_basic_user_file /etc/htpasswd-staging;
		proxy_pass http://mailpit:8025/mailpit/;
		include proxy.conf;
	}

	# Die Testumgebung wird nie indexiert. Das sagt der X-Robots-Tag oben, und
	# praktisch schützt die Basic Auth – nur bekommt ein Crawler dann einen 401
	# auf die robots.txt und muss raten. Hier steht die Regel im Klartext und
	# bewusst ohne Basic Auth, damit sie überhaupt gelesen werden kann. Der
	# Staging-Build bringt dieselbe robots.txt mit wie Prod, die wäre hier zu
	# freizügig – deshalb eigener Inhalt statt der Datei.
	location = /robots.txt {
		access_log    off;
		log_not_found off;
		default_type  text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}

	# Fingerprintete Angular-Bundles: fehlende Dateien als 404 ausliefern statt
	# über den SPA-Fallback die index.html (200, text/html). Sonst cachen
	# Browser HTML unter der JS-URL ("vergifteter" Cache) und das Lazy-Loading
	# der Routen-Module bricht dauerhaft, bis der Browser-Cache geleert wird.
	location ~* ^/(?:chunk|main|polyfills|styles|scripts|worker)-[\w.-]+\.(?:js|css)$ {
		auth_basic "Saisonmanager Staging";
		auth_basic_user_file /etc/htpasswd-staging;
		root /saisonmanager-frontend-staging/;
		try_files $uri =404;
	}

	# Angular-Frontend (Staging-Build)
	location / {
		auth_basic "Saisonmanager Staging";
		auth_basic_user_file /etc/htpasswd-staging;
		root /saisonmanager-frontend-staging/;
		try_files $uri $uri/ /index.html;
	}

	include general.conf;
}

# HTTP → HTTPS redirect. Die ACME-Challenge wird – wie bei den übrigen Vhosts –
# aus dem (in nginx gemounteten) Prod-Frontend-Verzeichnis ausgeliefert, damit
# certbot --webroot dieselbe Quelle nutzt wie bei der Erst-Ausstellung über den
# Default-Server. So gibt es kein Henne-Ei-Problem und Renewals funktionieren.
server {
	listen 80;
	listen [::]:80;
	server_name saisonmanager.dev;

	location /.well-known/acme-challenge/ {
		root /saisonmanager-frontend/;
	}

	location / {
		return 301 https://saisonmanager.dev$request_uri;
	}
}
