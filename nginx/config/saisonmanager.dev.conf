server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name saisonmanager.dev;

	# SSL
  ssl_certificate     /cert/fullchain.pem;
  ssl_certificate_key /cert/privkey.pem;

	# security
	include security.conf;

	# logging
	access_log /logs/saisonmanager.dev.access.log;
	error_log  /logs/saisonmanager.dev.error.log warn;

	# reverse proxy
	location /adminer {
		proxy_pass http://127.0.0.1:49209;
		include proxy.conf;
	}

	# reverse proxy  hawk rails api
	# /api-zugang ist eine Angular-Route (öffentlicher Antrag auf einen
	# API-Zugang) und kein API-Endpunkt. Ohne diesen Block gewinnt das
	# kürzere Präfix "location /api" darunter, nginx reicht die Adresse an
	# Rails weiter und die Seite antwortet mit 404. nginx wählt das längste
	# passende Präfix, deshalb genügt der eigene Block.
	location /api-zugang {
		root /saisonmanager-frontend/;
		try_files $uri $uri/ /index.html;
	}

	location /api {
		proxy_pass http://127.0.0.1:3040/api;
		include proxy.conf;
	}

	# robots.txt aus dem Frontend-Build – wie in Prod, damit lokal dasselbe
	# Verhalten herauskommt und nicht der SPA-Fallback greift.
	location = /robots.txt {
		root /saisonmanager-frontend/;
		try_files $uri =404;
		access_log    off;
		log_not_found off;
	}

	# Angular FE
	location / {
		#saisonmanager-frontend
		root /saisonmanager-frontend/;
    try_files $uri $uri/ index.html;

	}

	# additional config
	include general.conf;
}

# HTTP redirect
server {
	listen 49201;
	listen [::]:49201;

	server_name saisonmanager.dev;

	location / {
		return 301 https://saisonmanager.dev$request_uri;
	}
}
