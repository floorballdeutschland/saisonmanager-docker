server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name saisonmanager.dev;

	# SSL
  ssl_certificate     /cert/fullchain.pem;
  ssl_certificate_key /cert/privkey.pem;

	# security
	include security.conf;

	# logging
	access_log /logs/saisonmanager.dev.access.log;
	error_log  /logs/saisonmanager.dev.error.log warn;

	# reverse proxy
	location /adminer {
		proxy_pass http://127.0.0.1:49209;
		include proxy.conf;
	}

	# reverse proxy  hawk rails api
	location /api {
		proxy_pass http://127.0.0.1:3040/api;
		include proxy.conf;
	}

	# Angular FE
	location / {
		#saisonmanager-frontend
		root /saisonmanager-frontend/;
    try_files $uri $uri/ index.html;

	}

	# additional config
	include general.conf;
}

# HTTP redirect
server {
	listen 49201;
	listen [::]:49201;

	server_name saisonmanager.dev;

	location / {
		return 301 https://saisonmanager.dev$request_uri;
	}
}
