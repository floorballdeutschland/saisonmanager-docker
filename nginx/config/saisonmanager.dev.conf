# ════════════════════════════════════════════════════════════════════════
# saisonmanager.dev – Staging-Umgebung
#
# Wird am Ende von saisonmanager.prod.conf via `include` in den http{}-Block
# gezogen (siehe dort). Nutzt denselben nginx wie Prod, proxyt aber auf den
# isolierten Staging-Rails-Container und liefert das Staging-Frontend aus.
#
# Zugriffsschutz: Basic Auth auf der App (wie Prod) + X-Robots-Tag: noindex,
# damit die Testumgebung nicht indexiert wird. /api bleibt – wie in Prod – ohne
# Basic Auth, da dort der API-Key/Cookie-Schutz der Rails-API greift.
# ════════════════════════════════════════════════════════════════════════
server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name saisonmanager.dev;

	ssl_certificate     /etc/letsencrypt/live/saisonmanager.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/saisonmanager.dev/privkey.pem;

	# security
	include security.conf;

	# Testumgebung niemals indexieren lassen
	add_header X-Robots-Tag "noindex, nofollow" always;

	# logging
	access_log /logs/saisonmanager.dev.access.log;
	error_log  /logs/saisonmanager.dev.error.log warn;

	# Rails API (Staging-Container)
	location /api {
		proxy_pass http://rails-api-staging:3000/api;
		include proxy.conf;
	}

	# Statische Dateien von Rails (Logos etc.)
	location /verband {
		proxy_pass http://rails-api-staging:3000/verband;
		include proxy.conf;
	}

	# Mailpit Web-UI (gefangene E-Mails), hinter Basic Auth
	location /mailpit/ {
		auth_basic "Saisonmanager Staging";
		auth_basic_user_file /etc/htpasswd;
		proxy_pass http://mailpit:8025/mailpit/;
		include proxy.conf;
	}

	# Angular-Frontend (Staging-Build)
	location / {
		auth_basic "Saisonmanager Staging";
		auth_basic_user_file /etc/htpasswd;
		root /saisonmanager-frontend-staging/;
		try_files $uri $uri/ /index.html;
	}

	include general.conf;
}

# HTTP → HTTPS redirect (mit ACME-Challenge-Ausnahme für Cert-Erneuerung)
server {
	listen 80;
	listen [::]:80;
	server_name saisonmanager.dev;

	location /.well-known/acme-challenge/ {
		root /saisonmanager-frontend-staging/;
	}

	location / {
		return 301 https://saisonmanager.dev$request_uri;
	}
}
