server {
	include /etc/nginx/mime.types;
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name saisonmanager.dev;

	# SSL
  ssl_certificate     /cert/fullchain.pem;
  ssl_certificate_key /cert/privkey.pem;

	# security
	include security.conf;

	# logging
	access_log /logs/saisonmanager.dev.access.log;
	error_log  /log/saisonmanager.dev.error.log warn;

	# reverse proxy
	location /adminer {
		proxy_pass http://127.0.0.1:49202;
		include proxy.conf;
		# auth_basic  "Admin";
		# auth_basic_user_file /etc/nginx/.htpasswd;
	}

	# reverse proxy  hawk rails api
	location /api {
		proxy_pass http://127.0.0.1:49201/api;
		include proxy.conf;
	}

	# Angular FE
	location / {
		#saisonmanager-frontend
		alias /frontend_build/;
    try_files $uri $uri/ index.html;

	}

	# additional config
	include general.conf;
}

# HTTP redirect
server {
	listen 80;
	listen [::]:80;

	server_name saisonmanager.dev;

	include nginxconfig.io/letsencrypt.conf;

	location / {
		return 301 https://saisonmanager.dev$request_uri;
	}
}
