# robots.txt liegt bewusst NICHT hier, sondern in jedem Vhost einzeln: Der
# Block hatte kein root und lieferte deshalb einen 404, obwohl das Frontend eine
# robots.txt mitbringt. Und die Quelle unterscheidet sich je Vhost – Prod liest
# aus /saisonmanager-frontend/, Staging aus /saisonmanager-frontend-staging/ und
# soll ohnehin ein pauschales Disallow ausliefern. Ein zweiter
# `location = /robots.txt` im selben server-Block wäre ein nginx-Fehler
# ("duplicate location"), deshalb steht hier keiner.

# gzip
gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 6;
gzip_types      text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

