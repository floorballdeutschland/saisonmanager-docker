# Cache-Control für Dateien mit stabiler, nicht-fingerprinteter URL: die zur
# Laufzeit geladenen Übersetzungen (/assets/i18n/...) und die App-Shell
# (index.html) sollen vom Browser revalidiert werden, damit Deploys (z. B. neue
# i18n-Keys) sofort greifen statt aus dem Heuristik-Cache zu kommen.
# Fingerprintete JS/CSS-Bundles (Angular-Build hängt einen Content-Hash an den
# Dateinamen) dürfen dagegen unbegrenzt gecacht werden: ändert sich der Inhalt,
# ändert sich die URL. Ohne diesen Header revalidieren Browser jeden Chunk bei
# jedem Besuch einzeln (Heuristik-Cache), was den Seitenaufbau für
# Wiederbesucher unnötig verzögert.
# Diese Datei wird in nginx.prod.conf innerhalb von http{} inkludiert, daher
# ist die map hier zulässig; sie gilt http-weit, also auch für den
# Staging-Vhost (saisonmanager.staging.conf).
map $uri $sm_cache_control {
	default         "";
	~^/assets/i18n/ "no-cache";
	/index.html     "no-cache";
	"~^/(?:chunk|main|polyfills|styles|scripts|worker)-[\w.-]+\.(?:js|css)$" "public, max-age=31536000, immutable";
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name saisonmanager.org;

	ssl_certificate     /etc/letsencrypt/live/saisonmanager.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/saisonmanager.org/privkey.pem;

	# security
	include security.conf;

	# logging
	access_log /logs/saisonmanager.access.log;
	error_log  /logs/saisonmanager.error.log warn;

	# Domain-Umzug: saisonmanager.org leitet dauerhaft auf saisonmanager.de.
	location / {
		return 301 https://saisonmanager.de$request_uri;
	}
}

# HTTP → HTTPS redirect (with ACME challenge exception for renewals)
server {
	listen 80;
	listen [::]:80;
	server_name saisonmanager.org saisonmanager.floorball.de;

	location /.well-known/acme-challenge/ {
		root /saisonmanager-frontend/;
	}

	location / {
		return 301 https://saisonmanager.de$request_uri;
	}
}

# ════════════════════════════════════════════════════════════════════════
# doku.saisonmanager.org – statisches Rollenhandbuch (öffentlich, ohne Auth)
# Wird beim Frontend-Deploy nach /saisonmanager-frontend/doku/ ausgeliefert
# (Angular-Asset, siehe angular.json im Frontend-Repo).
# ════════════════════════════════════════════════════════════════════════
server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name doku.saisonmanager.org;

	ssl_certificate     /etc/letsencrypt/live/doku.saisonmanager.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/doku.saisonmanager.org/privkey.pem;

	# security
	include security.conf;

	# logging
	access_log /logs/doku.access.log;
	error_log  /logs/doku.error.log warn;

	# Domain-Umzug: doku.saisonmanager.org leitet dauerhaft auf doku.saisonmanager.de.
	location / {
		return 301 https://doku.saisonmanager.de$request_uri;
	}
}

# HTTP → HTTPS redirect (mit ACME-Challenge-Ausnahme für Cert-Erneuerung)
server {
	listen 80;
	listen [::]:80;
	server_name doku.saisonmanager.org;

	location /.well-known/acme-challenge/ {
		root /saisonmanager-frontend/;
	}

	location / {
		return 301 https://doku.saisonmanager.de$request_uri;
	}
}

# ════════════════════════════════════════════════════════════════════════
# saisonmanager.de – neue produktive Domain (bedient dasselbe neue System wie
# saisonmanager.org). Additiv während des Domain-Umzugs: .de wird zur
# öffentlichen Hauptdomain, .org bleibt übergangsweise aktiv und wird später
# auf .de umgeleitet.
# HINWEIS: Das LE-Zertifikat für saisonmanager.de muss VOR dem Aktivieren
# dieses Blocks existieren (per DNS-01 vorab ausgestellt), sonst schlägt
# `nginx -t -c /etc/nginx/nginx.prod.conf` fehl.
# ════════════════════════════════════════════════════════════════════════
server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name saisonmanager.de;

	ssl_certificate     /etc/letsencrypt/live/saisonmanager.de/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/saisonmanager.de/privkey.pem;

	# security
	include security.conf;

	# Revalidierung für i18n-Übersetzungen und App-Shell (siehe map
	# $sm_cache_control oben).
	add_header Cache-Control $sm_cache_control always;

	# logging
	access_log /logs/saisonmanager.de.access.log;
	error_log  /logs/saisonmanager.de.error.log warn;

	# /api-zugang ist eine Angular-Route (öffentlicher Antrag auf einen
	# API-Zugang) und kein API-Endpunkt. Ohne diesen Block gewinnt das
	# kürzere Präfix "location /api" darunter, nginx reicht die Adresse an
	# Rails weiter und die Seite antwortet mit 404. nginx wählt das längste
	# passende Präfix, deshalb genügt der eigene Block.
	location /api-zugang {
		root /saisonmanager-frontend/;
		try_files $uri $uri/ /index.html;
	}

	# Rails API
	location /api {
		proxy_pass http://rails-api:3000/api;
		include proxy.conf;
	}

	# Kalender-Abos unter der alten Adresse. Sie standen bis zum Umzug nach
	# /api/v2/calendar in der Oberfläche, waren dort aber nie erreichbar: nginx
	# reicht nur /api und /verband an Rails weiter, ein /calendar/... landete im
	# SPA-Fallback darunter, und der Angular-Router warf NG04002 (Sentry
	# SAISONMANAGER-2C: 413 Ereignisse in 26 Tagen, überwiegend Crawler mit der
	# alten Adresse aus ihrem Index).
	#
	# 301 statt 404, weil die Adresse damit endlich tut, was sie versprach: Wer
	# sein Abo eingerichtet hat, als der Link noch so verlinkt war, bekommt
	# danach echte Termine statt 51 KB HTML. Kalenderprogramme folgen der
	# Weiterleitung, Suchmaschinen tragen die neue Adresse nach.
	#
	# $request_uri traegt den ganzen Pfad samt Abfrage, aus /calendar/teams/7.ics
	# wird also /api/v2/calendar/teams/7.ics.
	location /calendar/ {
		return 301 /api/v2$request_uri;
	}

	# Static files served by Rails (logos, etc.)
	location /verband {
		proxy_pass http://rails-api:3000/verband;
		include proxy.conf;
	}

	# robots.txt aus dem Frontend-Build ausliefern (src/robots.txt im
	# Frontend-Repo, über angular.json als Asset mitgebaut). Ohne eigenen Block
	# greift der SPA-Fallback unten und liefert die index.html als robots.txt –
	# daraus liest kein Crawler eine Regel. try_files mit =404, damit ein Build
	# ohne die Datei ehrlich 404 sagt statt HTML auszuliefern.
	location = /robots.txt {
		root /saisonmanager-frontend/;
		try_files $uri =404;
		access_log    off;
		log_not_found off;
	}

	# Fingerprintete Angular-Bundles: fehlende Dateien als 404 ausliefern statt
	# über den SPA-Fallback die index.html (200, text/html). Sonst cachen
	# Browser HTML unter der JS-URL ("vergifteter" Cache) – mit dem
	# Immutable-Header aus der map oben bliebe der Eintrag bis zu einem Jahr
	# bestehen und das Lazy-Loading der Routen-Module bricht dauerhaft.
	location ~* ^/(?:chunk|main|polyfills|styles|scripts|worker)-[\w.-]+\.(?:js|css)$ {
		root /saisonmanager-frontend/;
		try_files $uri =404;
	}

	# Angular frontend
	location / {
		root /saisonmanager-frontend/;
		try_files $uri $uri/ /index.html;
	}

	include general.conf;
}

# HTTP → HTTPS redirect (mit ACME-Challenge-Ausnahme für Cert-Erneuerung)
server {
	listen 80;
	listen [::]:80;
	server_name saisonmanager.de www.saisonmanager.de;

	location /.well-known/acme-challenge/ {
		root /saisonmanager-frontend/;
	}

	location / {
		return 301 https://saisonmanager.de$request_uri;
	}
}

# www.saisonmanager.de – nur 301-Weiterleitung auf die Apex-Domain.
# Nutzt dasselbe Zertifikat wie saisonmanager.de (www als SAN mit ausstellen).
server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name www.saisonmanager.de;

	ssl_certificate     /etc/letsencrypt/live/saisonmanager.de/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/saisonmanager.de/privkey.pem;

	include security.conf;

	location / {
		return 301 https://saisonmanager.de$request_uri;
	}
}

# ════════════════════════════════════════════════════════════════════════
# doku.saisonmanager.de – statisches Rollenhandbuch (öffentlich, ohne Auth),
# Spiegel von doku.saisonmanager.org auf der neuen Domain.
# ════════════════════════════════════════════════════════════════════════
server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name doku.saisonmanager.de;

	ssl_certificate     /etc/letsencrypt/live/doku.saisonmanager.de/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/doku.saisonmanager.de/privkey.pem;

	# security
	include security.conf;

	# logging
	access_log /logs/doku.de.access.log;
	error_log  /logs/doku.de.error.log warn;

	root  /saisonmanager-frontend/doku/;
	index rollenhandbuch.html;

	# Das Handbuch darf gefunden werden; die Regel steht nur deshalb hier, weil
	# der Fallback unten sonst das Handbuch selbst als robots.txt ausliefern
	# würde (200 text/html). Eine eigene Datei braucht es dafür nicht, hier liegt
	# genau eine statische Seite und kein API-Zugriff dahinter.
	location = /robots.txt {
		access_log    off;
		log_not_found off;
		default_type  text/plain;
		return 200 "User-agent: *\nAllow: /\n";
	}

	location / {
		try_files $uri $uri/ /rollenhandbuch.html;
	}

	include general.conf;
}

# HTTP → HTTPS redirect (mit ACME-Challenge-Ausnahme für Cert-Erneuerung)
server {
	listen 80;
	listen [::]:80;
	server_name doku.saisonmanager.de;

	location /.well-known/acme-challenge/ {
		root /saisonmanager-frontend/;
	}

	location / {
		return 301 https://doku.saisonmanager.de$request_uri;
	}
}
