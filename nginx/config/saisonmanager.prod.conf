server {
	include /etc/nginx/mime.types;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2  on;

	server_name saisonmanager.org;

	ssl_certificate     /etc/letsencrypt/live/saisonmanager.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/saisonmanager.org/privkey.pem;

	# security
	include security.conf;

	# logging
	access_log /logs/saisonmanager.access.log;
	error_log  /logs/saisonmanager.error.log warn;

	# Rails API
	location /api {
		proxy_pass http://rails-api:3000/api;
		include proxy.conf;
	}

	# Static files served by Rails (logos, etc.)
	location /verband {
		proxy_pass http://rails-api:3000/verband;
		include proxy.conf;
	}

	# Angular frontend
	location / {
		auth_basic "Saisonmanager";
		auth_basic_user_file /etc/htpasswd;
		root /saisonmanager-frontend/;
		try_files $uri $uri/ /index.html;
	}

	include general.conf;
}

# HTTP → HTTPS redirect (with ACME challenge exception for renewals)
server {
	listen 80;
	listen [::]:80;
	server_name saisonmanager.org saisonmanager.floorball.de;

	location /.well-known/acme-challenge/ {
		root /saisonmanager-frontend/;
	}

	location / {
		return 301 https://saisonmanager.org$request_uri;
	}
}
