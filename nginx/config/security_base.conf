# security headers
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-XSS-Protection          "1; mode=block" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# . files
location ~ /\.(?!well-known) {
    deny all;
}

# Geratene PHP-Pfade (/admin.php, /xmlrpc.php, /wp-content/.../wp_filemanager.php
# …) bekommen sonst über den SPA-Fallback der Vhosts 200 mit der index.html.
# Billig für den Server, aber unwahr, und ein Scanner liest daraus, dass der
# Pfad existiert – rund 15.000 solcher Aufrufe in 7 Tagen (api#294). Hier wird
# keine PHP-Datei ausgeliefert, der Riegel kann also nichts Echtes treffen.
# Steht bewusst in der gemeinsamen Datei: Reguläre Ausdrücke schlagen die
# Präfix-Blöcke der Vhosts, greift damit vor SPA-Fallback, /api und Basic Auth.
#
# `~*` und nicht `~`: Der Vergleich ist sonst schreibungsabhängig, und
# /admin.PHP fiel weiter in den SPA-Fallback — 200 mit der index.html, also
# genau die unwahre Antwort, um die es hier geht (nachgemessen im
# nginx-Container: /admin.php 404, /admin.PHP 200).
location ~* \.php$ {
    return 404;
}
